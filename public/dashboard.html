<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nationwide Leads — Admin</title>

<style>
:root{
--bg:#0b1220;
--panel:#121a2f;
--card:#18224a;
--accent:#4f8cff;
--text:#e9efff;
--muted:#9aa3c7;
--green:#2ecc71;
--red:#ff5c5c;
--radius:14px;
}

*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;
background:linear-gradient(180deg,#0b1220,#0f1630);
color:var(--text);
}

.app{
max-width:420px;
margin:auto;
padding:16px;
}

/* Header */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}
.header h1{
font-size:18px;
margin:0;
}
.status{
font-size:12px;
color:var(--green);
}

/* Stats */
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:16px;
}
.card{
background:var(--card);
border-radius:var(--radius);
padding:14px;
}
.card h2{
margin:0;
font-size:22px;
}
.card p{
margin:4px 0 0;
font-size:12px;
color:var(--muted);
}

/* Section */
.section{
background:var(--panel);
border-radius:var(--radius);
padding:14px;
}
.section h3{
margin:0 0 10px;
font-size:15px;
}

/* Table */
.table{
width:100%;
border-collapse:collapse;
}
.table th,
.table td{
text-align:left;
font-size:13px;
padding:8px 0;
}
.table th{
color:var(--muted);
border-bottom:1px solid rgba(255,255,255,.08);
}
.table td{
border-bottom:1px solid rgba(255,255,255,.05);
}
.footer{
text-align:center;
margin-top:14px;
font-size:11px;
color:var(--muted);
}
</style>
</head>

<body>
<div class="app">

<!-- HEADER -->
<div class="header">
<h1>Nationwide Leads — Admin</h1>
<div class="status">● Live</div>
</div>

<!-- STATS -->
<div class="stats">
<div class="card">
<h2 id="processed">0</h2>
<p>Requests Processed</p>
</div>
<div class="card">
<h2 id="pending">0</h2>
<p>Pending</p>
</div>
<div class="card">
<h2 id="cancelled">0</h2>
<p>Cancelled</p>
</div>
<div class="card">
<h2 id="providers">0</h2>
<p>Active Providers</p>
</div>
</div>

<!-- LIVE REQUESTS -->
<div class="section">
<h3>Live Service Requests</h3>
<table class="table">
<thead>
<tr>
<th>Customer</th>
<th>Service</th>
</tr>
</thead>
<tbody id="requests">
<tr><td>Loading…</td><td></td></tr>
</tbody>
</table>
</div>

<div class="footer">
Citywide Leads is a lead-generation platform. Services performed by independent providers.
</div>

</div>

<script>
async function loadDashboard(){
try{
const res = await fetch("/admin/summary", { credentials:"include" });
if(!res.ok) throw new Error("Unauthorized");
const data = await res.json();

document.getElementById("processed").textContent = data.processed || 0;
document.getElementById("pending").textContent = data.pending || 0;
document.getElementById("cancelled").textContent = data.cancelled || 0;
document.getElementById("providers").textContent = data.providers || 0;

const tbody = document.getElementById("requests");
tbody.innerHTML = "";
(data.requests || []).forEach(r=>{
const tr = document.createElement("tr");
tr.innerHTML = `<td>${r.customer}</td><td>${r.service}</td>`;
tbody.appendChild(tr);
});

if(!data.requests || !data.requests.length){
tbody.innerHTML = "<tr><td>No live requests</td><td></td></tr>";
}
}catch(e){
document.body.innerHTML = "<div style='padding:20px;color:#ff5c5c'>Unauthorized</div>";
}
}

loadDashboard();
setInterval(loadDashboard, 5000);
</script>
</body>
</html>

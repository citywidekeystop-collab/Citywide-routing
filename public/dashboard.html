<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Citywide Dashboard</title>
<style>
body { font-family: Arial, sans-serif; background:#0f172a; color:#fff; margin:0; padding:18px; }
h1 { margin:0 0 14px; font-size:20px; }
.bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
input, select, button {
padding:10px; border-radius:10px; border:1px solid #334155; background:#111827; color:#fff;
}
button { cursor:pointer; border:none; background:#2563eb; }
button:hover { opacity:.9; }
.card { background:#111827; border:1px solid #334155; border-radius:14px; padding:12px; }
table { width:100%; border-collapse:collapse; margin-top:12px; }
th, td { text-align:left; padding:10px; border-bottom:1px solid #334155; font-size:13px; }
th { background:#0b1220; position:sticky; top:0; }
.pill { padding:4px 8px; border-radius:999px; font-size:12px; display:inline-block; border:1px solid #334155; }
.t1 { background:#052e16; }
.t2 { background:#3b0764; }
.muted { color:#94a3b8; font-size:12px; }
</style>
</head>
<body>
<h1>📊 Citywide Leads Dashboard</h1>
<div class="muted" id="status">Loading...</div>

<div class="bar">
<button onclick="loadLeads()">Refresh</button>
<select id="tierFilter" onchange="render()">
<option value="">All tiers</option>
<option value="tier1">Tier 1</option>
<option value="tier2">Tier 2</option>
</select>
<input id="search" placeholder="Search name / phone / service / zip" oninput="render()" />
</div>

<div class="card">
<table>
<thead>
<tr>
<th>ID</th>
<th>Tier</th>
<th>Name</th>
<th>Phone</th>
<th>ZIP</th>
<th>Service</th>
<th>Status</th>
<th>Created</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<script>
const API = location.origin; // works on Render automatically
let ALL = [];

async function loadLeads() {
document.getElementById("status").textContent = "Loading leads...";
try {
const res = await fetch(API + "/api/leads");
ALL = await res.json();
document.getElementById("status").textContent =
"Loaded " + ALL.length + " leads • " + new Date().toLocaleString();
render();
} catch (e) {
document.getElementById("status").textContent = "Error loading leads: " + e;
}
}

function render() {
const tier = document.getElementById("tierFilter").value;
const q = (document.getElementById("search").value || "").toLowerCase();
const rows = document.getElementById("rows");
rows.innerHTML = "";

const filtered = ALL.filter(l => {
if (tier && String(l.tier) !== tier) return false;
const blob = `${l.id} ${l.name||""} ${l.phone||""} ${l.zip||""} ${l.service||""} ${l.status||""}`.toLowerCase();
if (q && !blob.includes(q)) return false;
return true;
});

filtered.forEach(l => {
const tr = document.createElement("tr");
const tierClass = (l.tier === "tier2") ? "t2" : "t1";
tr.innerHTML = `
<td>${l.id}</td>
<td><span class="pill ${tierClass}">${l.tier || "tier1"}</span></td>
<td>${escapeHtml(l.name || "")}</td>
<td>${escapeHtml(l.phone || "")}</td>
<td>${escapeHtml(l.zip || "")}</td>
<td>${escapeHtml(l.service || "")}</td>
<td>${escapeHtml(l.status || "")}</td>
<td>${escapeHtml(l.created_at || "")}</td>
`;
rows.appendChild(tr);
});
}

function escapeHtml(s){
return String(s).replace(/[&<>"']/g, m => ({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
})[m]);
}

loadLeads();
</script>
</body>
</html>
